<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="https://school30tmn-max.github.io/zayavki_sch30/logo_b.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="https://school30tmn-max.github.io/zayavki_sch30/logo_w.png" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки по ремонту — Школа №30</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f7f2;--bg3:#FFFBDB;
  --text:#1a1a18;--text2:#4a4a45;--text3:#8a8a85;
  --border:#dddbd0;--border2:#c8c6bb;
  --blue:#2A44CC;--blue-bg:#eef1fc;--blue-text:#1e35a8;
  --green:#2d6b0f;--green-bg:#e8f5de;--green-text:#1e4f08;
  --amber:#7a4a00;--amber-bg:#fff3cc;--amber-text:#7a4a00;
  --red:#8b1a1a;--red-bg:#fde8e8;--red-text:#8b1a1a;
  --gold:#FDCB00;--orange:#F07C00;
  --radius:8px;--radius-lg:14px;--school:#2A44CC;--school-dark:#1e35a8;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#2a2a28;--bg3:#333330;
  --text:#e8e6de;--text2:#a8a6a0;--text3:#6a6a65;
  --border:#3a3a38;--border2:#4a4a48;
  --blue-bg:#0c3060;--blue-text:#85B7EB;
  --green-bg:#1a3008;--green-text:#C0DD97;
  --amber-bg:#3a2004;--amber-text:#FAC775;
  --red-bg:#3a0808;--red-text:#F09595;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:url("https://school30tmn-max.github.io/zayavki_sch30/background.png");pointer-events:none;z-index:0;opacity:.4}
body > *{position:relative;z-index:1}
header{background:var(--school);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;height:62px;box-shadow:0 2px 12px rgba(42,68,204,.3)}
@media(max-width:480px){
  header{height:auto;padding:10px 14px;gap:10px}
  header img.logo,header img[style*="height:40px"]{height:28px!important}
  header h1{font-size:13px!important}
  header p{display:none}
  header > div:nth-child(2){height:28px}
}
header img.logo{height:38px;width:auto;object-fit:contain;flex-shrink:0}
header .h-accent{width:3px;height:38px;background:var(--gold);border-radius:2px;flex-shrink:0}
header .h-text h1,header div h1{font-size:16px;font-weight:700;letter-spacing:.01em;line-height:1.2}
header .h-text p{font-size:11px;opacity:.65;margin-top:1px}
.tabs{background:var(--school-dark);display:flex;padding:0 20px}
.tab{padding:12px 20px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.6);border-bottom:3px solid transparent;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-weight:500}
@media(max-width:480px){.tab{padding:10px 16px;font-size:13px}}
.tab.active{color:#fff;border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:rgba(255,255,255,.85)}
.container{max-width:100%;margin:0 auto;padding:24px 32px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:0 2px 16px rgba(42,68,204,.07)}
.form-grid{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:var(--bg);color:var(--text);transition:border .15s;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--school);box-shadow:0 0 0 3px rgba(26,74,138,.12)}
textarea{resize:vertical;min-height:90px}
.photo-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .15s}
.photo-zone:hover{border-color:var(--school);background:var(--blue-bg)}
.photo-zone svg{width:28px;height:28px;stroke:var(--text3);display:block;margin:0 auto 8px}
.photo-zone p{font-size:13px;color:var(--text3)}
.previews{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.prev-wrap{position:relative}
.prev-wrap img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.prev-rm{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:#E24B4A;color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:bold;line-height:1;padding:0}
.btn-primary{width:100%;padding:13px;background:var(--school);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:var(--school-dark);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.alert{border-radius:var(--radius);padding:12px 16px;font-size:14px;margin-bottom:16px;display:none}
.alert.success{background:var(--green-bg);color:var(--green-text);border:1px solid #97C459;display:block}
.alert.error{background:var(--red-bg);color:var(--red-text);border:1px solid #F09595;display:block}
.lock-wrap{text-align:center;padding:48px 16px}
.lock-wrap svg{width:40px;height:40px;stroke:var(--text3);display:block;margin:0 auto 16px}
.lock-wrap p{color:var(--text2);font-size:14px;margin-bottom:16px}
.lock-input{max-width:220px;margin:0 auto 10px;display:block}
.lock-btn{padding:10px 28px;background:var(--school);color:#fff;border:none;border-radius:var(--radius);font-size:14px;cursor:pointer;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,200px));gap:10px;margin-bottom:20px;justify-content:center}
@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:opacity .15s}
.stat:hover{opacity:.8}
.stat.active-stat{outline:2px solid var(--school)}
.stat .n{font-size:24px;font-weight:600}
.stat .l{font-size:12px;color:var(--text2);margin-top:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.filt{padding:6px 14px;border:1.5px solid #B48660;border-radius:20px;background:var(--bg);font-size:13px;cursor:pointer;color:var(--text2);transition:all .15s;font-weight:500}
.filt.active{background:var(--school);color:#fff;border-color:var(--school)}
.filt:hover:not(.active){border-color:var(--school);color:var(--school)}
.date-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.date-row label{font-size:13px;color:var(--text2);margin:0;font-weight:400}
.date-row input[type=date]{width:auto;padding:5px 10px;font-size:13px}
.date-row button{padding:5px 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text2);cursor:pointer}
.date-row button:hover{background:var(--bg2)}
.req-list{display:grid;gap:10px}
.req{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.req.overdue{border-left:3px solid #E24B4A}
.req-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.req-meta{font-size:12px;color:var(--text3);margin-bottom:3px}
.req-name{font-size:14px;font-weight:600}
.req-desc{font-size:13px;color:var(--text2);margin:8px 0 10px}
.req-foot{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px}
.req-photos{display:flex;gap:6px;flex-wrap:wrap}
.req-photos img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;transition:opacity .15s}
.req-photos img:hover{opacity:.85}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}
.b-new{background:var(--blue-bg);color:var(--blue-text)}
.b-wip{background:var(--amber-bg);color:var(--amber-text)}
.b-done{background:var(--green-bg);color:var(--green-text)}
.b-cat{background:var(--bg2);color:var(--text2);font-weight:400}
.b-overdue{background:var(--red-bg);color:var(--red-text);font-size:11px}
.b-sub{background:#EEF1FC;color:#1e35a8;font-size:11px;border:1px solid #c5cef5}
.b-longterm{background:#FFF3CC;color:#7a4a00;font-size:11px;border:1px solid #f0d87a}
.status-sel{font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer}
.note-input{font-size:12px;padding:6px 9px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);width:100%;height:68px;resize:none;overflow-y:auto;vertical-align:top;font-family:inherit}
.arch-btn{font-size:12px;padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text3);cursor:pointer;transition:all .15s}
.arch-btn:hover{background:var(--red-bg);color:var(--red-text);border-color:#F09595}
.unarch-btn{font-size:12px;padding:4px 8px;border:1.5px solid var(--green);border-radius:6px;background:var(--bg);color:var(--green);cursor:pointer;transition:all .15s}
.unarch-btn:hover{background:var(--green-bg)}
.req-controls{display:grid;grid-template-columns:1fr;gap:6px;min-width:190px}
.arch-btn:hover{background:var(--red-bg);color:var(--red-text);border-color:#F09595}
.history{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.history-title{font-size:11px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.history-item{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--text2);padding:2px 0}
.history-item .h-time{color:var(--text3);white-space:nowrap;font-size:11px}
.history-item .h-status{font-weight:500;color:var(--text)}
.empty{text-align:center;padding:40px;color:var(--text3);font-size:14px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--school);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.show-arch{font-size:13px;color:var(--text3);cursor:pointer;text-decoration:underline;margin-bottom:10px;display:inline-block}
</style>
</head>
<body>

<header>
  <img style="height:40px;width:auto;object-fit:contain;flex-shrink:0" src="https://school30tmn-max.github.io/zayavki_sch30/logo.png" alt="Логотип Школы №30">
  <div style="width:3px;height:38px;background:#FDCB00;border-radius:2px;flex-shrink:0"></div>
  <div>
    <h1>Заявки на обслуживание</h1>
    <p style="font-size:11px;opacity:.7;margin-top:1px">МАОУ СОШ имени Фёдора Ефимовича Фёдорова · Тюмень</p>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('form')">Новая заявка</button>
  <button class="tab" onclick="switchTab('dash')">Дашборд</button>
</div>

<div id="view-form">
<div class="container">
<div class="card">
  <div id="alert-form" class="alert"></div>
  <div class="form-grid">
    <div class="row2">
      <div><label>ФИО заявителя *</label><input id="f-name" type="text" placeholder="Иванова Мария Петровна"></div>
      <div><label>Телефон *</label><input id="f-phone" type="tel" placeholder="+7 (912) 345-67-89"></div>
    </div>
    <div class="row2">
      <div><label>Кабинет / помещение *</label><input id="f-room" type="text" placeholder="Каб. 214 / Столовая"></div>
      <div><label>Область заявки *</label>
        <select id="f-cat">
          <option value="">— выберите —</option>
          <option>Сантехника</option>
          <option>Электрика</option>
          <option>Системное администрирование</option>
          <option>Клининг</option>
          <option>Пропускные карты</option>
          <option>Иное</option>
        </select>
      </div>
    </div>
    <div><label>Описание заявки *</label><textarea id="f-desc" placeholder="Опишите подробно: что сломано, где именно, когда заметили..."></textarea></div>
    <div>
      <label>Фото (обязательно) *</label>
      <div class="photo-zone" onclick="document.getElementById('f-photo').click()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/></svg>
        <p>Нажмите чтобы прикрепить фото</p>
        <p style="font-size:11px;margin-top:3px;opacity:.6">JPG, PNG — можно несколько</p>
      </div>
      <input type="file" id="f-photo" accept="image/*" multiple style="display:none" onchange="addPhotos(this)">
      <div class="previews" id="previews"></div>
    </div>
    <button class="btn-primary" id="submit-btn" onclick="submitForm()">Отправить заявку</button>
  </div>
</div>
</div>
</div>

<div id="view-dash" style="display:none">
<div class="container">

<div id="lock-screen">
  <div class="lock-wrap">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
    <p>Раздел для ответственных сотрудников</p>
    <input type="password" class="lock-input" id="pwd" placeholder="Пароль" onkeydown="if(event.key==='Enter')unlock()">
    <br><button class="lock-btn" onclick="unlock()">Войти</button>
    <p id="pwd-err" style="color:#A32D2D;font-size:13px;margin-top:8px;display:none">Неверный пароль</p>
  </div>
</div>

<div id="dash-inner" style="display:none">
  <div class="stats" id="stats"></div>

  <div class="filters" id="cat-filters">
    <button class="filt active" data-cat="all" onclick="fCat(this)">Все</button>
    <button class="filt" data-cat="Сантехника" onclick="fCat(this)">Сантехника</button>
    <button class="filt" data-cat="Электрика" onclick="fCat(this)">Электрика</button>
    <button class="filt" data-cat="Системное администрирование" onclick="fCat(this)">Сисадмин</button>
    <button class="filt" data-cat="Клининг" onclick="fCat(this)">Клининг</button>
    <button class="filt" data-cat="Пропускные карты" onclick="fCat(this)">Пропуска</button>
    <button class="filt" data-cat="Иное" onclick="fCat(this)">Иное</button>
  </div>

  <div class="filters" id="status-filters">
    <button class="filt active" data-st="all" onclick="fSt(this)">Все статусы</button>
    <button class="filt" data-st="Новая" onclick="fSt(this)">Новые</button>
    <button class="filt" data-st="В работе" onclick="fSt(this)">В работе</button>
    <button class="filt" data-st="Выполнено" onclick="fSt(this)">Выполнено</button>
  </div>

  <div id="smart-filters" class="filters" style="margin-bottom:14px"></div>
  <div class="date-row">
    <label>С:</label>
    <input type="date" id="date-from">
    <label>По:</label>
    <input type="date" id="date-to">
    <button onclick="applyDates()">Применить</button>
    <button onclick="clearDates()">Сбросить</button>
  </div>

  <div id="loading" style="padding:20px;color:var(--text2);font-size:14px;display:none"><span class="spinner"></span>Загрузка заявок...</div>
  <div class="req-list" id="req-list"></div>
  <div style="margin-top:16px">
    <span class="show-arch" onclick="toggleArchive()">📦 Показать архив</span>
    <div id="arch-list" style="display:none;margin-top:10px"></div>
  </div>
</div>

</div>
</div>

<div id="lb" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center;cursor:zoom-out">
  <img id="lb-img" style="max-width:92vw;max-height:92vh;border-radius:8px;object-fit:contain">
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzuRGHi2C4Gb_VGqZB3B6xOS___eI2gEhVYmhksZQGh8QJKQc4YnDs_DhEf98vKzxtE/exec';

let photos=[], allReqs=[], curCat='all', curSt='all', curSub=[], dateFrom=null, dateTo=null, savedPass='', archiveVisible=false;

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(t==='form'&&i===0)||(t==='dash'&&i===1)));
  document.getElementById('view-form').style.display=t==='form'?'':'none';
  document.getElementById('view-dash').style.display=t==='dash'?'':'none';
}

function addPhotos(inp) {
  Array.from(inp.files).forEach(f=>{const r=new FileReader();r.onload=e=>{photos.push(e.target.result);renderPreviews();};r.readAsDataURL(f);});
  inp.value='';
}
function renderPreviews() {
  document.getElementById('previews').innerHTML=photos.map((d,i)=>`<div class="prev-wrap"><img src="${d}"><button class="prev-rm" onclick="photos.splice(${i},1);renderPreviews()">×</button></div>`).join('');
}

async function submitForm() {
  const fields={name:document.getElementById('f-name').value.trim(),phone:document.getElementById('f-phone').value.trim(),room:document.getElementById('f-room').value.trim(),cat:document.getElementById('f-cat').value,desc:document.getElementById('f-desc').value.trim()};
  if(!fields.name||!fields.phone||!fields.room||!fields.cat||!fields.desc) return showAlert('form','Заполните все обязательные поля','error');
  if(photos.length===0) return showAlert('form','Прикрепите хотя бы одно фото','error');
  const btn=document.getElementById('submit-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Отправка...';clearAlert('form');
  try {
    const res=await apiCall({action:'submit',...fields,photos});
    if(res.ok){showAlert('form','Заявка принята! Номер: '+res.id,'success');['f-name','f-phone','f-room','f-desc'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-cat').value='';photos=[];renderPreviews();}
    else showAlert('form','Ошибка: '+(res.error||'неизвестная'),'error');
  }catch(e){showAlert('form','Нет связи. Проверьте интернет.','error');}
  btn.disabled=false;btn.innerHTML='Отправить заявку';
}

async function unlock() {
  const p=document.getElementById('pwd').value;
  document.getElementById('pwd-err').style.display='none';
  document.getElementById('loading').style.display='block';
  try {
    const res=await apiCall({action:'get',pass:p});
    if(res.ok){savedPass=p;allReqs=res.data;document.getElementById('lock-screen').style.display='none';document.getElementById('dash-inner').style.display='block';renderDash();}
    else{document.getElementById('pwd-err').textContent='Неверный пароль';document.getElementById('pwd-err').style.display='block';}
  }catch(e){document.getElementById('pwd-err').textContent='Нет связи с сервером';document.getElementById('pwd-err').style.display='block';}
  document.getElementById('loading').style.display='none';
}

function isOverdue(req) {
  if(req.status!=='В работе') return false;
  const e=[...(req.history||[])].reverse().find(h=>h.status==='В работе');
  if(!e) return false;
  const t=parseDate(e.time);if(!t) return false;
  return(Date.now()-t)/(1000*60*60*24)>3;
}
function parseDate(str) {
  if(!str) return null;
  const m=str.match(/(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/);
  if(m) return new Date(m[3],m[2]-1,m[1],m[4],m[5]).getTime();
  const d=new Date(str);return isNaN(d)?null:d.getTime();
}
function applyDates(){dateFrom=document.getElementById('date-from').value||null;dateTo=document.getElementById('date-to').value||null;renderDash();}
function clearDates(){dateFrom=dateTo=null;document.getElementById('date-from').value='';document.getElementById('date-to').value='';renderDash();}
function inDateRange(req) {
  if(!dateFrom&&!dateTo) return true;
  const t=parseDate(req.date);if(!t) return true;
  const ds=new Date(t).toISOString().slice(0,10);
  if(dateFrom&&ds<dateFrom) return false;
  if(dateTo&&ds>dateTo) return false;
  return true;
}

function renderDash() {
  const active=allReqs.filter(r=>r.status!=='Архив');
  const total=active.length,nw=active.filter(r=>r.status==='Новая').length,wip=active.filter(r=>r.status==='В работе').length,done=active.filter(r=>r.status==='Выполнено').length,prol=active.filter(r=>r.status==='В работе'&&r.sub==='Продление').length,lng=active.filter(r=>r.status==='В работе'&&r.sub==='Долгосрочный ремонт').length;
  document.getElementById('stats').innerHTML=[['Всего',total,'all','all'],['Новые',nw,'all','Новая'],['В работе',wip,'all','В работе'],['Выполнено',done,'all','Выполнено']]
    .map(([l,n,cat,st])=>`<div class="stat" onclick="quickFilter('${cat}','${st}')"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  renderSmartFilters(active,prol,lng);
  let f=active;
  if(curCat!=='all') f=f.filter(r=>r.cat===curCat);
  if(curSt!=='all') f=f.filter(r=>r.status===curSt);
  if(curSub.length>0) f=f.filter(r=>curSub.includes(r.sub));
  f=f.filter(r=>inDateRange(r));
  const list=document.getElementById('req-list');
  if(!f.length){list.innerHTML='<div class="empty">Заявок не найдено</div>';return;}
  list.innerHTML=f.map(r=>renderReq(r)).join('');
}

function renderSmartFilters(active,prol,lng) {
  const cats=['Сантехника','Электрика','Системное администрирование','Клининг','Пропускные карты','Иное'];
  const catLabels={'Сантехника':'Сантехника','Электрика':'Электрика','Системное администрирование':'Сисадмин','Клининг':'Клининг','Пропускные карты':'Пропуска','Иное':'Иное'};
  let html='';
  [['all','Все статусы'],['Новая','Новые'],['В работе','В работе'],['Выполнено','Выполнено']].forEach(([st,label])=>{
    const n=st==='all'?active.length:active.filter(r=>r.status===st).length;
    html+=`<button class="filt${curSt===st?' active':''}" onclick="fStSmart('${st}')">${label} <span style="opacity:.7">${n}</span></button> `;
  });
  if(curSt==='В работе'){
    html+=' <span style="color:var(--border2);margin:0 4px">|</span> ';
    [{sub:'Продление',label:'⏳ Продление',n:prol},{sub:'Долгосрочный ремонт',label:'🔧 Долгосрочный ремонт',n:lng}].forEach(({sub,label,n})=>{
      html+=`<button class="filt${curSub.includes(sub)?' active':''}" onclick="fSubSmart('${sub}')">${label} <span style="opacity:.7">${n}</span></button> `;
    });
  }
  html+='<br style="width:100%;display:block;margin:6px 0">';
  cats.forEach(cat=>{
    const n=active.filter(r=>r.cat===cat).length;
    html+=`<button class="filt${curCat===cat?' active':''}" onclick="fCatSmart('${cat}')">${catLabels[cat]} <span style="opacity:.7">${n}</span></button> `;
  });
  document.getElementById('smart-filters').innerHTML=html;
}

function quickFilter(cat,st){curCat=cat;curSt=st;curSub=[];renderDash();}
function fStSmart(st){curSt=st;curSub=[];renderDash();}
function fCatSmart(cat){curCat=curCat===cat?'all':cat;renderDash();}
function fSubSmart(sub){const idx=curSub.indexOf(sub);if(idx>=0)curSub.splice(idx,1);else curSub.push(sub);renderDash();}

function renderReq(r,isArch) {
  const overdue=isOverdue(r);
  const bc=r.status==='Новая'?'b-new':r.status==='В работе'?(overdue?'b-overdue':'b-wip'):'b-done';
  const subBadge=r.sub==='Продление'?'<span class="badge b-sub">⏳ Продление</span>':r.sub==='Долгосрочный ремонт'?'<span class="badge b-longterm">🔧 Долгосрочный ремонт</span>':'';
  const ph=r.photos&&r.photos.length?`<div class="req-photos">${r.photos.map(p=>`<img src="${p}" alt="фото" onclick="openLb(this.src)">`).join('')}</div>`:'';
  const hist=r.history&&r.history.length>1?`<div class="history"><div class="history-title">История изменений</div>${r.history.map(h=>`<div class="history-item"><span class="h-time">${h.time}</span><span class="h-status">${h.status}</span>${h.note?`<span style="color:var(--text3)"> — ${h.note}</span>`:''}</div>`).join('')}</div>`:'';
  const subSel=!isArch&&r.status==='В работе'?`<select class="status-sel" style="width:100%" onchange="changeSub('${r.id}','${r.sheet}',this.value)"><option value="" ${!r.sub?'selected':''}>— уточнение —</option><option ${r.sub==='Продление'?'selected':''}>Продление</option><option ${r.sub==='Долгосрочный ремонт'?'selected':''}>Долгосрочный ремонт</option></select>`:'';
  const noteField=!isArch?`<textarea class="note-input" placeholder="Комментарий исполнителя" onchange="saveNote('${r.id}','${r.sheet}',this.value)">${(r.note||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>`:'';
  const statusSel=!isArch?`<select class="status-sel" style="width:100%" onchange="changeStatus('${r.id}','${r.sheet}',this.value)"><option ${r.status==='Новая'?'selected':''}>Новая</option><option ${r.status==='В работе'?'selected':''}>В работе</option><option ${r.status==='Выполнено'?'selected':''}>Выполнено</option></select>${subSel}`:'';
  const archBtn=!isArch?`<button class="arch-btn" onclick="archiveReq('${r.id}','${r.sheet}')" title="В архив">📦</button>`:`<button class="unarch-btn" onclick="unarchiveReq('${r.id}','${r.sheet}')" title="Вернуть">↩ Вернуть</button>`;
  return `<div class="req${overdue?' overdue':''}"><div class="req-head"><div><div class="req-meta">${fmtDate(r.date)} · ${r.room} · ${r.phone}</div><div class="req-name">${r.name}</div></div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${overdue&&r.status==='В работе'?'<span class="badge b-overdue" style="font-size:11px">⚠ просрочено</span>':''}<span class="badge ${bc}">${r.status}</span>${subBadge}${archBtn}</div></div><span class="badge b-cat">${r.cat}</span><div class="req-desc">${r.desc}</div><div class="req-foot">${ph}<div class="req-controls">${noteField}${statusSel}</div></div>${hist}</div>`;
}

async function changeStatus(id,sheet,status) {
  const req=allReqs.find(r=>String(r.id)===String(id));if(!req)return;
  const old=req.status;req.status=status;
  if(old!==status){const now=fmtDate(new Date().toISOString());req.history=req.history||[];req.history.push({status,time:now,note:req.note||''});}
  renderDash();
  await apiCall({action:'status',pass:savedPass,id,sheet,status});
}
async function saveNote(id,sheet,note) {
  const req=allReqs.find(r=>String(r.id)===String(id));if(req)req.note=note;
  await apiCall({action:'status',pass:savedPass,id,sheet,status:req?.status,note});
}
async function changeSub(id,sheet,sub) {
  const req=allReqs.find(r=>String(r.id)===String(id));if(!req)return;
  req.sub=sub;
  if(sub){const now=fmtDate(new Date().toISOString());req.history=req.history||[];req.history.push({status:req.status,time:now,note:'📌 '+sub});}
  renderDash();
  await apiCall({action:'status',pass:savedPass,id,sheet,status:req.status,note:req.note||'',sub});
}
async function archiveReq(id,sheet) {
  if(!confirm('Архивировать заявку?'))return;
  const res=await apiCall({action:'status',pass:savedPass,id,sheet,status:'Архив'});
  if(res.ok){allReqs=allReqs.filter(r=>String(r.id)!==String(id));renderDash();}
}
async function unarchiveReq(id,sheet) {
  if(!confirm('Вернуть заявку из архива?'))return;
  const res=await apiCall({action:'unarch',pass:savedPass,id,sheet});
  if(res.ok){const el=document.getElementById('arch-list');if(el)el.innerHTML='<div class="empty">Обновите архив</div>';alert('Заявка возвращена. Обновите страницу.');}
  else alert('Ошибка: '+(res.error||'неизвестная'));
}
async function toggleArchive() {
  archiveVisible=!archiveVisible;
  const el=document.getElementById('arch-list');
  const btn=document.querySelector('.show-arch');
  if(!archiveVisible){el.style.display='none';btn.textContent='📦 Показать архив';return;}
  btn.textContent='📦 Скрыть архив';el.style.display='block';
  el.innerHTML='<span class="spinner"></span> Загрузка...';
  try{const res=await apiCall({action:'archive',pass:savedPass});
    el.innerHTML=res.ok&&res.data.length?res.data.map(r=>renderReq(r,true)).join(''):'<div class="empty">Архив пуст</div>';
  }catch(e){el.innerHTML='<div class="empty">Ошибка загрузки</div>';}
}

function fmtDate(d){try{return new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Yekaterinburg'});}catch(e){return d;}}
function openLb(src){document.getElementById('lb-img').src=src;document.getElementById('lb').style.display='flex';}
function showAlert(where,msg,type){const el=document.getElementById('alert-'+where);el.className='alert '+type;el.textContent=msg;}
function clearAlert(where){const el=document.getElementById('alert-'+where);el.className='alert';el.textContent='';}

function apiCall(data) {
  return new Promise(function(resolve,reject){
    const cb='cb'+Date.now()+Math.floor(Math.random()*10000);
    const d=encodeURIComponent(JSON.stringify(data));
    const url=API_URL+'?action='+(data.action||'ping')+'&d='+d+'&callback='+cb;
    const script=document.createElement('script');
    const timer=setTimeout(function(){reject(new Error('timeout'));cleanup();},15000);
    function cleanup(){delete window[cb];if(script.parentNode)document.body.removeChild(script);clearTimeout(timer);}
    window[cb]=function(result){resolve(result);cleanup();};
    script.src=url;
    script.onerror=function(){reject(new Error('network'));cleanup();};
    document.body.appendChild(script);
  });
}
</script>
